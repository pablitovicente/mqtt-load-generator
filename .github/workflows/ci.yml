name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -cover ./...

      # goinstall builds golangci-lint with this job's Go (1.27, from go.mod). A prebuilt
      # binary made with an older Go refuses to check a go 1.27 module. Same version as
      # the one used locally.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          args: ./...
