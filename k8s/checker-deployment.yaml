---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-checker
spec:
  selector:
    matchLabels:
      app: mqtt-checker
  replicas: 1
  template:
    metadata:
      labels:
        app: mqtt-checker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: mqtt-checker
        image: ghcr.io/pablitovicente/mqtt-load-generator:v2.0.0
        command:
        - /mqtt-load-generator
        # No CPU limit on purpose: Kubernetes throttles a container that goes over its CPU limit,
        # which pauses the tool mid-run and distorts the rates it measures. The memory limit
        # stops runaway buffering from affecting the node. Raise these for bigger runs.
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        env:
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mqtt-load-generator
              key: password
        args:
        - sub
        - -h
        -  mqtt # hostname of mqtt server
        - -p
        - "1883" # port of mqtt server
        - -u
        - secret # username
        - -t
        - /golang/pub # target topic to subscribe to
        - --disable-bar # disable interactive bar
