---
apiVersion: batch/v1
kind: Job
metadata:
  name: mqtt-load-generator
  labels:
    app: mqtt-load-generator
spec:
  completions: 1 # how many runs of the mqtt-load-generator do you want to run
  parallelism: 1 # how many should run in parallel
  ttlSecondsAfterFinished: 1800 # how many seconds until the job is cleaned up
  template:
    metadata:
      labels:
        app: mqtt-load-generator
    spec:
      # Run as the image's non-root user (uid 65534), with the kernel calls Kubernetes allows
      # by default.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mqtt-load-generator
        image: ghcr.io/pablitovicente/mqtt-load-generator:v2.0.0
        # The tool only opens network connections and writes to stdout/stderr, so it needs no
        # extra rights and no writable files.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mqtt-load-generator
              key: password
        # No CPU limit on purpose: Kubernetes throttles a container that goes over its CPU limit,
        # which pauses the tool mid-run and distorts the rates it measures. The memory limit
        # stops runaway buffering from affecting the node. Raise these for bigger runs.
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            memory: 512Mi
        args:
        - -h
        - mqtt # hostname of mqtt server
        - -p
        - "1883" # port of mqtt server
        - -u
        - secret # username
        - -c
        - "1000" # number of messages per client
        - -s
        - "1000" # size per message in byte
        - -t
        - /golang/pub # target topic to publish to
        - -i
        - "1" # interval between published messages in ms
        - -n
        - "100" # numer of parallel clients
      restartPolicy: Never
  backoffLimit: 5
  